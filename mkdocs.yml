site_name: BamBalaam
site_url: https://bambalaam.me
site_author: André Madeira Cortes
site_description: Personal website of André Madeira Cortes
copyright: Copyright &copy; 2026 André Madeira Cortes

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/design.css
  - stylesheets/gantt.css
  - stylesheets/education.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BamBalaam
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/andremadeiracortes/

plugins:
  - search
  - blog

nav:
  - Home: index.md
  - About: about.md
  - Projects: projects.md
  - Blog:
    - blog/index.md
  - Now: now.md

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
